---
name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - env:
          VERSION: 1.7.12
        run: |
          base=https://github.com/rhysd/actionlint/releases/download
          curl -fsSL "$base/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz" | tar -xz actionlint

      - run: ./actionlint -color
