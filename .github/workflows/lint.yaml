---
name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - run: shellcheck --version

      - run: shellcheck do-backup docker-cmd
